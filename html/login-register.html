<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <title>Login-Register</title>
    <link rel="stylesheet" href="/css/login-register.css">
    <link rel="stylesheet" href="/css/mobile.css">
    
</head>
<body>
    <header>
        <div class="logo">
            <img src="/images/logored.png" alt="Логотип" />
        </div>
        <nav class="navigation">
            <a href="pageuser.html#aboutus" data-i18n="nav.about">О нас</a>
            <a href="menuuser.html" data-i18n="nav.menu">Меню</a>
            <a href="pageuser.html#ourbranches" data-i18n="nav.contacts">Контакты</a>
        <div class="lang-switcher">
            <button class="lang-btn active" data-lang="ru" onclick="setLang('ru')">RU</button>
            <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
            <button class="lang-btn" data-lang="kg" onclick="setLang('kg')">KG</button>
        </div>
        </nav>
    </header>

    <div class="wrapper">
        <div class="form-box login">
            <h2 data-i18n="login.title">Вход</h2>
            <form id="loginForm" action="#">
                <div class="input-box">
                    <span class="icon">
                        <ion-icon name="mail"></ion-icon>
                    </span>
                    <input type="email" id="loginEmail" required>
                    <label data-i18n="login.email">Почта</label>
                </div>
                <div class="input-box">
                    <span class="icon">
                        <ion-icon name="lock-closed"></ion-icon>
                    </span>
                    <input type="password" id="loginPassword" required>
                    <label data-i18n="login.password">Пароль</label>
                </div>
                <div class="remember-forgot">
                    <a href="#" data-i18n="login.forgot_password">Забыли пароль?</a>
                </div>
                <button type="submit" class="btn" data-i18n="login.button"> Войти </button>

                <div class="login-register">
                    <p>
                        <span data-i18n="login.no_account">Нет аккаунта?</span>
                        <a href="#" class="register-link" data-i18n="login.register_link">Зарегистрироваться</a>
                    </p>
                </div>
            </form>
        </div>

        <div class="form-box register">
            <h2 data-i18n="register.title">Регистрация</h2>
            <form id="registerForm" action="#">
                <div class="name-fields">
                <div class="input-box">
                    <span class="icon">
                        <ion-icon name="person"></ion-icon>
                    </span>
                    <input type="text" id="registerFirstName" required>
                    <label data-i18n="register.first_name">Имя</label>
                </div>
                <div class="input-box">
                    <span class="icon">
                        <ion-icon name="person"></ion-icon>
                    </span>
                    <input type="text" id="registerSecondName" required>
                    <label data-i18n="register.last_name">Фамилия</label>
                </div>
            </div>
                <div class="input-box">
                    <span class="icon">
                        <ion-icon name="call"></ion-icon>
                    </span>
                    <input type="tel" id="registerPhone" required>
                    <label data-i18n="register.phone">Номер телефона</label>
                </div>
                <div class="input-box">
                    <span class="icon">
                        <ion-icon name="calendar"></ion-icon>
                    </span>
                    <input type="date" required id="registerBirthdate">
                    <label data-i18n="register.birthdate">Дата рождения</label>
                </div>
                
                <div class="input-box">
                    <span class="icon">
                        <ion-icon name="mail"></ion-icon>
                    </span> 
                    <input type="email" id="registerEmail" required>
                    <label data-i18n="register.email">Почта</label>
                </div>
                <div class="input-box">
                    <span class="icon">
                        <ion-icon name="lock-closed"></ion-icon>
                    </span>
                    <input type="password" id="registerPassword" required>
                    <label data-i18n="register.password">Пароль</label>
                </div>
                <button type="submit" class="btn" data-i18n="register.button"> Зарегистрироваться </button>
                <div class="login-register">
                    <p>
                        <span data-i18n="register.login_prompt">Уже есть аккаунт?</span>
                        <a href="#" class="login-link" data-i18n="register.login_link">Войти</a>
                    </p>
                </div>
            </form>
        </div>
        
    </div>


    <script src="/js/i18n.js"></script>
    <script src="/js/config.js"></script>
    <script src="/js/login-register.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

</body>

</html>
