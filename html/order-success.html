<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказ оформлен — Adriano Coffee</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/order-success.css">
</head>
<body>

<header class="success-header">
    <a href="menuuser.html" class="logo-link">
        <img src="/images/logo.png" alt="Adriano Coffee">
    </a>
</header>

<main class="success-main">

    <div class="success-hero">
        <div class="success-circle">
            <i class="fas fa-check"></i>
        </div>
        <h1 data-i18n="success.title">Заказ оформлен!</h1>
        <p class="success-subtitle" data-i18n="success.subtitle">Оплата прошла успешно. Ожидайте подтверждения.</p>
    </div>

    <div id="loading-state" class="loading-state">
        <i class="fas fa-spinner fa-spin"></i>
        <p data-i18n="success.loading">Загружаем детали заказа...</p>
    </div>

    <div id="order-details" style="display:none;">

        <div class="order-meta-card">
            <div class="order-meta-row">
                <span class="meta-label" data-i18n="success.order_number">Номер заказа</span>
                <span class="meta-value order-id-value" id="order-number">—</span>
            </div>
            <div class="order-meta-row">
                <span class="meta-label" data-i18n="success.status">Статус</span>
                <span class="meta-value"><span class="status-badge" id="order-status">—</span></span>
            </div>
            <div class="order-meta-row">
                <span class="meta-label" data-i18n="success.date">Дата</span>
                <span class="meta-value" id="order-date">—</span>
            </div>
        </div>

        <div class="detail-card">
            <div class="detail-card-title">
                <i class="fas fa-map-marker-alt"></i>
                <span data-i18n="success.address_title">Адрес доставки</span>
            </div>
            <p id="order-address" class="detail-text">—</p>
        </div>

        <div class="detail-card">
            <div class="detail-card-title">
                <i class="fas fa-utensils"></i>
                <span data-i18n="success.items_title">Состав заказа</span>
            </div>
            <div id="order-items" class="order-items-list"></div>
        </div>

        <div class="total-card">
            <div id="points-used-row" class="total-row bonus-row" style="display:none;">
                <span><i class="fas fa-star"></i> <span data-i18n="success.points_used">Оплачено баллами</span></span>
                <span id="points-used-amount" class="bonus-amount">— сом</span>
            </div>
            <div class="total-row main-total">
                <span data-i18n="success.total">Итого оплачено</span>
                <span id="order-total" class="total-amount">— сом</span>
            </div>
            <div id="bonus-earned-row" class="bonus-earned-banner" style="display:none;">
                <i class="fas fa-star"></i>
                <span data-i18n="success.bonus_earned">За этот заказ вам начислят</span>
                <strong id="bonus-earned-amount">0</strong>
                <span data-i18n="success.bonus_after">баллов после доставки</span>
            </div>
        </div>

    </div>

    <div class="success-actions">
        <a href="menuuser.html" class="btn-menu">
            <i class="fas fa-utensils"></i>
            <span data-i18n="success.btn_menu">Вернуться в меню</span>
        </a>
        <a href="dashboard.html" class="btn-orders">
            <i class="fas fa-clipboard-list"></i>
            <span data-i18n="success.btn_orders">Мои заказы</span>
        </a>
    </div>

</main>

<!-- i18n подключается ДО order-success.js чтобы t() был доступен -->
<script src="/js/config.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/order-success.js"></script>
</body>
</html>
